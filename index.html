<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Koszyki">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<title>Koszyki</title>
</head>
<body>
<div class="app" id="app">
  <section class="view on" id="v-home" aria-label="Koszyki"></section>
  <section class="view" id="v-hist" aria-label="Historia"></section>
  <section class="view" id="v-month" aria-label="Miesiąc"></section>
  <section class="view" id="v-set" aria-label="Ustawienia"></section>
  <section class="detail" id="detail" aria-label="Szczegóły koszyka"></section>
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-1.4 11.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8zM8 7a4 4 0 0 1 8 0"/></svg>Koszyki</button>
    <button class="tab" data-act="tab" data-tab="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Historia</button>
    <span></span>
    <button class="tab" data-act="tab" data-tab="month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Miesiąc</button>
    <button class="tab" data-act="tab" data-tab="set"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Ustawienia</button>
  </nav>
  <button class="fab" id="fab" data-act="open-sheet" aria-label="Dodaj wydatek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="scrim" id="scrim" data-act="sheet-close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Wydatek"></div>
  <div class="scrim dscrim" id="dscrim" data-act="next-cancel"></div>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastUndo" type="button">Cofnij</button></div>
  <div class="welcome" id="welcome"></div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
